version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DB_FILE=/app/data/dev.db
    # For local development with live-reload, uncomment the source folders below:
    # volumes:
    #   - ./app:/app/app
    #   - ./ui:/app/ui
    #   - ./scripts:/app/scripts
    # Mount the SQLite DB to persist data across container restarts:
    volumes:
      - data-volume:/app/data
    restart: always

volumes:
  data-volume:
